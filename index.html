<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom is an accessibility requirement, not a layout bug. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Beebizy — Event management software built for how teams actually work</title>
    <meta
      name="description"
      content="Whether you're coordinating a global enterprise summit, moving fast with a lean ops team, or rallying a community around a cause — Beebizy gives you the control room you need."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="Beebizy — Event management software" />
    <meta
      property="og:description"
      content="Every team runs events. Beebizy makes it effortless."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beebizy — Event management software" />
    <meta
      name="twitter:description"
      content="Every team runs events. Beebizy makes it effortless."
    />
    <meta name="twitter:image" content="/opengraph.jpg" />

    <!-- Matches the app's own surface so mobile browser chrome doesn't clash. -->
    <meta name="theme-color" content="#faf9f5" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The stylesheet imports Plus Jakarta Sans and JetBrains Mono; warm those
         connections early. The previous build preloaded Inter, which is never used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
