<!--
  Tab icon: the bee from the logo, reduced to what survives at 16px — a yellow ground,
  a black body with two stripes, and antennae. The previous file was Replit's default
  orange rounded square.
-->
<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="38" fill="#F8D810"/>
  <g fill="#000000">
    <!-- antennae -->
    <path d="M74 44c-6-9-16-15-25-18" stroke="#000" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M106 44c6-9 16-15 25-18" stroke="#000" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- head -->
    <circle cx="90" cy="62" r="22"/>
    <!-- body -->
    <ellipse cx="90" cy="116" rx="34" ry="38"/>
  </g>
  <!-- stripes, cut from the body in the brand yellow -->
  <path d="M58 104h64a34 38 0 0 1-1 11H59a34 38 0 0 1-1-11z" fill="#F8D810"/>
  <path d="M62 127h56a34 38 0 0 1-6 11H68a34 38 0 0 1-6-11z" fill="#F8D810"/>
</svg>
